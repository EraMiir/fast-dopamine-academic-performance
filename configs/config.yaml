experiment_name: "student_gpa_social_media_benchmark"
random_seed: 42
test_size: 0.2
timeout_seconds: 30

paths:
  sample_data: "data/sample/sample_survey.csv"
  full_data: "data/cleaned_survey.csv"
  output_log: "logs/benchmark_results.json"

features:
  target: "Last Academic Result (GPA/CGPA)"
  numeric_features:
    - "Age"
    - "Study time (In Hours)"
    - "Attendance rate (In Percentile)"
    - "Time spent in social media (hours)"
    - "Sleep Disturbance on Sleep Quality"
    - "Mood Modification Scale"
    - "Anxiety Scale "
    - "Depression Scale"
    - "Self-esteem Scale"
    - "Social Media Distraction During Academic Activities "

models:
  baseline_ridge:
    alpha: 1.0
  random_forest:
    n_estimators: 100
    max_depth: 5
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 3

guardrails:
  max_latency_ms: 2000.0
  max_ram_mb: 256.0
