experiment:
  name: "fast-dopamine-academic-performance"
  seed: 42
  warmup_runs: 3
  eval_runs: 20
  sample_sizes: [64, 128, 192, 256]
  test_size: 0.2
  bootstrap_iterations: 2000
  confidence_level: 0.95

paths:
  dataset: "data/cleaned_survey.csv"
  raw_logs: "data/raw/test_run.jsonl"
  summary_csv: "data/processed/metrics_summary.csv"
  figures_dir: "results/figures"

models:
  Ridge:
    alpha: 1.0
  Random Forest:
    n_estimators: 100
    max_depth: 6
  Gradient Boosting:
    n_estimators: 100
    learning_rate: 0.08
    max_depth: 3
