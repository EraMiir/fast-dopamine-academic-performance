experiment_name: "fast-dopamine-academic-performance"
random_seed: 42

model_params:
  test_size: 0.2
  cv_folds: 5
  target_col: "Last Academic Result (GPA/CGPA)"

features:
  domains:
    screen_profile:
      - "Time spent in social media (hours)"
      - "Social Media Platform"
    gaming_circadian:
      - "Most time spent in a day"
      - "Sleep Disturbance on Sleep Quality"
    attention_fragmentation:
      - "Social Media Distraction During Academic Activities "
      - "Withdrawal symptoms (Side effects of not using social media)"
  control_variables:
    course: "Education Level"
    attendance: "Attendance rate (In Percentile)"
    study_time: "Study time (In Hours)"
